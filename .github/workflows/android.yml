name: Android APK Build and Release
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sudha-upload-key.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sudha-upload-key.p12" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PversionCode=${{ github.run_number }}
      - name: Build signed release APK
        if: github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
      - name: Prepare APK for release
        if: github.event_name != 'pull_request'
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk sudha-browser.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk sudha-browser.apk
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudha-browser-${{ github.run_number }}
          path: sudha-browser.apk
          if-no-files-found: error
      - name: Publish update release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SUDHA BROWSER build ${{ github.run_number }}
          body: Automated SUDHA BROWSER update. Install over the existing app when Android prompts.
          files: sudha-browser.apk
          make_latest: true
