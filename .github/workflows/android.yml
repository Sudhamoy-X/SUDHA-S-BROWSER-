name: Android APK Build and Release
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: gradle --no-daemon assembleDebug -PversionCode=${{ github.run_number }}
      - name: Prepare release APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk sudha-browser.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudha-browser-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish update release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SUDHA BROWSER build ${{ github.run_number }}
          body: Automated SUDHA BROWSER update. Install over the existing app when Android prompts.
          files: sudha-browser.apk
          make_latest: true
